<!-- src/views/register.html -->
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja Pracownika - Laboratorium IoT</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #666; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { width: 100%; padding: 10px; background: #28a745; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .error-msg { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; font-size: 14px; text-align: center; margin-bottom: 15px; display: none; }
        .success-msg { color: #155724; background: #d4edda; padding: 10px; border-radius: 4px; font-size: 14px; text-align: center; margin-bottom: 15px; display: none; }
        .nav-link { display: block; text-align: center; margin-top: 15px; font-size: 14px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
<div class="register-box">
    <h2>Rejestracja Nowego Pracownika</h2>
    <div class="error-msg" id="errorBlock"></div>
    <div class="success-msg" id="successBlock"></div>
    
    <form method="POST" action="/register">
        <div class="form-group">
            <label>Nazwa użytkownika (Nowy Login)</label>
            <input type="text" name="username" required placeholder="np. badacz_nowy">
        </div>
        <div class="form-group">
            <label>Hasło systemowe</label>
            <input type="password" name="password" required placeholder="••••••••••••">
        </div>
        <div class="form-group">
            <label>Rola i Uprawnienia w Laboratorium</label>
            <select name="role" required>
                <option value="przegladajacy">Audytor (Tylko odczyt)</option>
                <option value="badacz">Młodszy Badacz (Zapis pomiarów, usuwanie własnych)</option>
                <option value="badacz_super">Starszy Badacz (Zapis pomiarów, usuwanie wszystkich)</option>
                <option value="admin">Administrator (Pełne uprawnienia)</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">Zarejestruj pracownika</button>
    </form>
    <a href="/dashboard" class="nav-link">← Powrót do Panelu</a>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    if (params.has('error')) {
        const errBlock = document.getElementById('errorBlock');
        errBlock.innerText = decodeURIComponent(params.get('error'));
        errBlock.style.display = 'block';
    }
    if (params.has('success')) {
        const succBlock = document.getElementById('successBlock');
        succBlock.innerText = decodeURIComponent(params.get('success'));
        succBlock.style.display = 'block';
    }
</script>
</body>
</html>
