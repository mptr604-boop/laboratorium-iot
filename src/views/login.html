<!-- src/views/login.html -->
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie - Laboratorium IoT</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); width: 100%; max-width: 360px; }
        h2 { margin-top: 0; text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #666; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { width: 100%; padding: 10px; background: #007bff; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .error-msg { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; font-size: 14px; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Autoryzacja Personelu</h2>
    <div class="error-msg" id="errorBlock"></div>
    <form method="POST" action="/login">
        <div class="form-group">
            <label>Nazwa użytkownika (Login)</label>
            <input type="text" name="username" required placeholder="np. inzynier_jan">
        </div>
        <div class="form-group">
            <label>Hasło dostępowe</label>
            <input type="password" name="password" required placeholder="••••••••••••">
        </div>
        <button type="submit" class="btn-submit">Zaloguj do systemu</button>
    </form>
</div>
<script>
    // Prosty skrypt wyciągający błąd z parametrów URL i wyświetlający go pracownikowi
    const params = new URLSearchParams(window.location.search);
    if (params.has('error')) {
        const errBlock = document.getElementById('errorBlock');
        errBlock.innerText = decodeURIComponent(params.get('error'));
        errBlock.style.display = 'block';
    }
</script>
</body>
</html>
