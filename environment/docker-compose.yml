services:
  # --- ŚRODOWISKO STAGING (PORT 8080) ---
  lab-app-staging:
    build:
      context: ..
      dockerfile: environment/Dockerfile
    container_name: lab_backend_staging
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      # Osobny katalog danych stagingu (STORAGE_DIR ustawia deploy.sh); nie dzieli bazy z produkcją
      - ${STORAGE_DIR:-../deploy_root/storage/staging}:/app/storage
    environment:
      - NODE_ENV=staging
      - APP_VERSION=${APP_VERSION_TAG:-staging-latest}
      - IS_DOCKER=true
      - PASSWORD_PEPPER=${PASSWORD_PEPPER:-}

  # --- ŚRODOWISKO PRODUKCYJNE (PORT 80) ---
  lab-app-production:
    build:
      context: ..
      dockerfile: environment/Dockerfile
    container_name: lab_backend_production
    restart: unless-stopped
    ports:
      - "80:3000"
    volumes:
      # Trwały katalog bazy produkcyjnej (STORAGE_DIR ustawia deploy.sh)
      - ${STORAGE_DIR:-../deploy_root/storage/production}:/app/storage
    environment:
      - NODE_ENV=production
      - APP_VERSION=${APP_VERSION_TAG:-v1.0.0}
      - IS_DOCKER=true
      - PASSWORD_PEPPER=${PASSWORD_PEPPER:-}
    deploy:
      update_config:
        order: start-first
        delay: 5s
        failure_action: rollback
